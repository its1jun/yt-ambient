<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambient Light</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main class="app">
    <!-- 상단 브랜드: 보라색 박스 안 -->
    <section class="banner" aria-label="Ambient Light">
      <header class="banner__header">
        <div class="banner__logo">
          <img class="banner__logo-img" src="../assets/icon.png" alt="Ambient Light">
        </div>

        <div class="banner__brand">
          <h1 class="banner__title">Ambient Light</h1>
        </div>
      </header>
    </section>

    <!-- 중앙 스크롤 영역 -->
    <section class="panel" aria-label="Ambient Light settings">
      <div class="panel__scroll">

        <div class="panel__heading">
          <span class="panel__heading-mark" aria-hidden="true">🛠</span>
          <span class="panel__heading-title">Settings</span>
        </div>
        <hr class="panel__divider">

        <div class="setting-row">
          <div class="setting-row__icon" aria-hidden="true">☼</div>

          <div class="setting-row__info">
            <strong class="setting-row__title">Ambient Lighting</strong>
            <small class="setting-row__desc">Soft glow around the video</small>
          </div>

          <label class="switch" aria-label="Ambient Lighting">
            <input class="switch__input" type="checkbox" checked>
            <span class="switch__track"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-row__icon" aria-hidden="true">☀</div>

          <div class="setting-row__info">
            <strong class="setting-row__title">Glow intensity</strong>
            <small class="setting-row__desc">Adjust the ambient effect</small>
          </div>

          <div class="slider">
            <small class="slider__value">70%</small>
            <div class="slider__control">
              <input
                class="slider__input"
                type="range"
                min="0"
                max="100"
                value="70"
                aria-label="Glow intensity"
              >
              <div class="slider__track" aria-hidden="true">
                <span class="slider__fill"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="panel__reset">
          <button class="panel__reset-button" type="button">
            Reset
          </button>
        </div>

      </div>
    </section>

    <!-- 하단 고정 ON/OFF 버튼 -->
    <button class="power-button" type="button" aria-pressed="ture" aria-label="Ambient Light power">
      <span class="power-button__state">OFF</span>
    </button>

    <!-- 하단 고정 푸터 -->
    <footer class="footer">
      <span>AMBIENT LIGHT</span>
      <span class="footer__dot">•</span>
      <span>MADE BY its1jun</span>
    </footer>

  </main>
</body>
</html>
